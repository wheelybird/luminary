version: 2
updates:
  # Opens a PR when a new php:8.4.x-apache base image is published
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    ignore:
      - dependency-name: php
        update-types: [version-update:semver-major, version-update:semver-minor]
      # PHP tags pre-releases as e.g. 8.4.28RC1, which Dependabot doesn't recognise as pre-release
      - dependency-name: php
        versions: ["*RC*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
